name: release
# Tag `vX.Y.Z` (matching the crate version) → build the self-contained windows-sosa-mcp.exe,
# attach it with SHA256SUMS to a GitHub Release, then pack, smoke-test and (when configured)
# publish the npm package. Pre-release tags (`v0.2.0-rc.1`) make a GitHub pre-release and an
# npm `next` dist-tag. See docs/release.md.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  TARGET: x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Tag matches the crate version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "windows-sosa-mcp") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match windows-sosa-mcp $version"
            exit 1
          fi
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked --target ${{ env.TARGET }}
      - name: Stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\$env:TARGET\release\windows-sosa-mcp.exe" dist\windows-sosa-mcp.exe
          Get-ChildItem dist
      - name: Smoke test the release exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-smoke","version":"0"}}}'
          $note = '{"jsonrpc":"2.0","method":"notifications/initialized"}'
          $list = '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $out = ($init, $note, $list) -join "`n" | & dist\windows-sosa-mcp.exe
          $resp = $out | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.id -eq 2 }
          $n = @($resp.result.tools).Count
          if ($n -ne 24) { throw "expected 24 tools, got $n" }
          "ok: $n tools"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-sosa-mcp-release
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-sosa-mcp-release
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum windows-sosa-mcp.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          if [[ "$TAG" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "windows-sosa-mcp $TAG" \
            --notes-file notes.md \
            --verify-tag \
            "${pre[@]}"

  npm:
    needs: [build, release]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: windows-sosa-mcp-release
          path: dist
      - name: Stage, pack and smoke-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node npm/stage.mjs dist/windows-sosa-mcp.exe
          if ($LASTEXITCODE -ne 0) { throw 'stage failed' }
          npm pack ./npm/windows-sosa-mcp --pack-destination dist
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $tgz = (Get-ChildItem dist/windows-sosa-mcp-*.tgz).FullName
          node npm/smoke.mjs $tgz
          if ($LASTEXITCODE -ne 0) { throw 'npm smoke test failed' }
      - name: Publish to npm
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          dist_tag=latest
          if [[ "$TAG" == *-* ]]; then dist_tag=next; fi
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          elif [ "$TRUSTED_PUBLISHING" = "true" ]; then
            # Trusted publishing exchanges the OIDC token itself (npm >= 11.5.1).
            npm install -g npm@latest
          else
            echo "::notice::npm publish skipped: set the NPM_TOKEN secret or the NPM_TRUSTED_PUBLISHING variable (docs/release.md)"
            exit 0
          fi
          npm publish dist/windows-sosa-mcp-*.tgz --provenance --access public --tag "$dist_tag"
